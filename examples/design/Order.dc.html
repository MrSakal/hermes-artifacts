<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen app: pick a drink</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#7a3e12}a:hover{color:#4f270b}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 24px; display: flex; flex-direction: column; gap: 20px; background: #f7f3ec; color: #1f1b16; font-family: Inter, 'Segoe UI', system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 14px; color: #6b6255">Good morning</p>
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 600">What are you having?</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{drinks}}" as="drink" hint-placeholder-count="4">
<button type="button" onClick="{{drink.pick}}" style="{{drink.style}}">
<span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
<span style="font-size: 17px; font-weight: 600">{{drink.name}}</span>
<span style="font-size: 14px; color: #6b6255">{{drink.detail}}</span>
</span>
<span style="font-size: 15px; font-weight: 600">[PRICE]</span>
</button>
</sc-for>
</div>
<sc-if value="{{nothing}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 14px; color: #6b6255">Tap a drink to choose it.</p>
</sc-if>
<div style="flex-grow: 1"></div>
<a href="Checkout.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #1f1b16; color: #f7f3ec; font-size: 17px; font-weight: 600; text-decoration: none">{{cta}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    const drinks = [
      { id: 'flat', name: 'Flat white', detail: 'Double shot, whole milk' },
      { id: 'filter', name: 'Filter of the day', detail: 'Hambela washed, V60' },
      { id: 'cortado', name: 'Cortado', detail: 'Equal parts espresso and milk' },
      { id: 'tonic', name: 'Espresso tonic', detail: 'House espresso over tonic' }
    ];
    const base = 'display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 16px; border-radius: 14px; font: inherit; color: inherit; cursor: pointer; text-align: left; ';
    const picked = drinks.find((d) => d.id === this.state.picked);
    return {
      drinks: drinks.map((d) => ({
        ...d,
        style: base + (d.id === this.state.picked ? 'background: #fbf8f3; border: 2px solid #7a3e12' : 'background: #fbf8f3; border: 2px solid transparent'),
        pick: () => this.setState({ picked: d.id })
      })),
      nothing: !picked,
      cta: picked ? 'Continue with ' + picked.name : 'Continue'
    };
  }
}
</script>
</body>
</html>
