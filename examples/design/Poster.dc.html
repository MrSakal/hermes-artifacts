<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen cupping night poster</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 816px; height: 1056px; box-sizing: border-box; padding: 72px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: auto 1fr auto; column-gap: 24px; row-gap: 40px; background: #1f1b16; color: #f7f3ec; font-family: Inter, 'Segoe UI', system-ui, sans-serif">
<div style="grid-column: span 6; display: flex; justify-content: space-between; align-items: center; gap: 16px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 28px; font-weight: 600">Lumen</span>
<dc-import name="Tag" label="Free entry" hint-size="160px,40px"></dc-import>
</div>
<div style="grid-column: span 5; display: flex; flex-direction: column; justify-content: center; gap: 28px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 112px; line-height: 0.95; font-weight: 600; color: {{accent}}">Cupping night</h1>
<p style="margin: 0; font-size: 26px; line-height: 1.4; max-width: 520px">Taste six new coffees side by side with the roasters who picked them.</p>
</div>
<div style="grid-column: span 6; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; padding-top: 28px; border-top: 2px solid {{accent}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; color: #c9bfb0">When</span>
<span style="font-size: 22px; font-weight: 600">[YOUR DATE], 7 pm</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; color: #c9bfb0">Where</span>
<span style="font-size: 22px; font-weight: 600">[YOUR ADDRESS]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 16px; color: #c9bfb0">Seats</span>
<span style="font-size: 22px; font-weight: 600">Reply at the bar</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#e8a35c","options":["#e8a35c","#9fd3c7","#f2d16b","#f08a7e"]},"$preview":{"width":816,"height":1056}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#e8a35c' };
  }
}
</script>
</body>
</html>
