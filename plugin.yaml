name: hermes-artifacts
version: 0.3.1
description: >
  Claude-style artifacts for Hermes. The agent publishes pages, dashboards (charts and tables from
  datasets, every figure traceable to its source), slide decks (present; export PDF/PPTX) and docs
  (Markdown; export DOCX/PDF), versioned, and they replace the built-in Artifacts page of Hermes Desktop
  with a gallery and a sandboxed viewer with comments. Pages talk back through a small bridge
  (storage, send, ask). Works with Hermes Desktop connected to a remote Hermes server.
author: MrSakal
license: MIT
homepage: https://github.com/MrSakal/hermes-artifacts
requires_hermes: ">=0.22.5"
tags: [artifacts, desktop, html, ui, preview]
provides_tools:
  - artifact_publish
  - artifact_guide
  - artifact_list
  - artifact_read
  - artifact_open
  - artifact_inbox
  - artifact_delete
  - artifact_comments
  - artifact_reply
  - artifact_desktop_cdp
config_schema:
  shell_port:
    type: int
    default: 8797
    label: Browser viewer port
    description: Loopback port of the optional browser viewer (started only by artifact_open where=browser or `hermes artifacts serve`).
  content_port:
    type: int
    default: 8798
    label: Browser viewer content port
    description: Loopback port the browser viewer serves artifact HTML from (a separate origin, sandboxed).
  cdp_port:
    type: int
    default: 9222
    label: Hermes Desktop CDP port
    description: Debugging port artifact_desktop_cdp attaches to, or launches the local Hermes Desktop with.
  bridge_tools:
    type: str
    default: ""
    label: Bridge tool allowlist
    description: Comma-separated tool names an artifact may call through window.hermes.callTool in the browser viewer. Empty means none.
