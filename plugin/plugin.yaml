name: hermes-artifacts
version: 0.15.0
description: >
  Claude-style artifacts for Hermes: pages, dashboards, slides, docs, sheets, boards, designs, films and design
  systems, versioned, in a gallery and sandboxed viewer that replace the built-in Artifacts page of Hermes
  Desktop. Docs, sheets and boards are live: the user and Hermes edit them in place. Dashboards can run live MCP
  queries; a design system is copied into the decks, canvases and films that wear it. Comments, and a small
  bridge for pages (storage, send, ask). Works with Hermes Desktop on a remote Hermes server.
author: MrSakal
license: MIT
homepage: https://github.com/MrSakal/hermes-artifacts
requires_hermes: ">=0.22.5"
tags: [artifacts, desktop, html, ui, preview]
provides_hooks:
  - pre_llm_call
  - on_session_end
  - post_compaction
provides_tools:
  - artifact_publish
  - artifact_guide
  - artifact_check
  - artifact_live_read
  - artifact_live_edit
  - artifact_list
  - artifact_read
  - artifact_open
  - artifact_inbox
  - artifact_delete
  - artifact_comments
  - artifact_reply
  - design_system_get
  - design_system_export
config_schema:
  shell_port:
    type: int
    default: 8797
    label: Browser viewer port
    description: Loopback port of the optional browser viewer (started only by artifact_open where=browser or `hermes artifacts serve`).
  content_port:
    type: int
    default: 8798
    label: Browser viewer content port
    description: Loopback port the browser viewer serves artifact HTML from (a separate origin, sandboxed).
  require_approval:
    type: bool
    default: false
    label: Ask before every live dashboard query
    description: Off, a live query that Hermes published, or that you saved in Sources, runs without a click; only queries that came in some other way ask first. On, every new or changed query waits for your click.
  bridge_tools:
    type: str
    default: ""
    label: Bridge tool allowlist
    description: Comma-separated tool names an artifact may call through window.hermes.callTool in the browser viewer. Empty means none.
