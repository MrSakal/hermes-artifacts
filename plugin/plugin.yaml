name: hermes-artifacts
version: 0.19.0
description: >
  Artifacts for Hermes: pages, dashboards, slides, docs, sheets, boards, designs, films and design
  systems, versioned, in a gallery and sandboxed viewer that replace the built-in Artifacts page of Hermes
  Desktop. Docs, sheets and boards are live: the user and Hermes edit them in place. Dashboards can run live MCP
  queries; a design system is copied into the decks, canvases and films that wear it. Comments, and a small
  bridge for pages (storage, send, ask). Works with Hermes Desktop on a remote Hermes server.
author: MrSakal
license: MIT
homepage: https://github.com/MrSakal/hermes-artifacts
requires_hermes: ">=0.22.5"
tags: [artifacts, desktop, html, ui, preview]
provides_hooks:
  - pre_llm_call
  - on_session_end
  - post_compaction
  - post_tool_call
provides_tools:
  - ha_publish
  - ha_guide
  - ha_check
  - ha_live_read
  - ha_live_edit
  - ha_list
  - ha_read
  - ha_open
  - ha_inbox
  - ha_delete
  - ha_comments
  - ha_reply
  - ha_design_system_get
  - ha_design_system_export
config_schema:
  shell_port:
    type: int
    default: 8797
    label: Browser viewer port
    description: Loopback port of the optional browser viewer (started only by ha_open where=browser or `hermes artifacts serve`).
  content_port:
    type: int
    default: 8798
    label: Browser viewer content port
    description: Loopback port the browser viewer serves artifact HTML from (a separate origin, sandboxed).
  require_approval:
    type: bool
    default: false
    label: Ask before every live dashboard query
    description: Off, a live query runs without asking when Hermes ran exactly that call in the chat before publishing it; any other query asks first, in Hermes Desktop's own dialog. On, every new or changed query asks.
  page_diagnostics:
    type: bool
    default: true
    label: Record page errors for Hermes
    description: On, an artifact open in Hermes Desktop or the browser viewer records its errors (uncaught errors, console errors, failed loads) and whether it showed, on the Hermes host, for ha_check. The last 3 versions are kept and deleted with the artifact. Off, nothing is recorded.
  bridge_tools:
    type: str
    default: ""
    label: Bridge tool allowlist
    description: Comma-separated tool names an artifact may call through window.hermes.callTool in the browser viewer. Empty means none.
  frame_ancestors:
    type: str
    default: "'self'"
    label: Browser viewer frame-ancestors
    description: Space-separated CSP sources that may show the browser viewer in a frame. 'self' (the default) lets no other site frame it; artifact content always lets the viewer frame it.
